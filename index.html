<!doctype html>
<html lang="es" data-theme="dark" data-mode="adult">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEXIS - Plataforma de Autoestudio de Lenguaje y Escritura</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/variables.css" />
    <link rel="stylesheet" href="/src/css/animations.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
    <link rel="stylesheet" href="/src/css/darkmode.css" />
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white relative min-h-screen">
    <!-- Mesh Gradient Background Layer -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div class="absolute top-[-10%] left-[-10%] w-[45%] h-[45%] rounded-full bg-blue-600/20 blur-[120px]"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[55%] h-[55%] rounded-full bg-indigo-600/20 blur-[120px]"></div>
      <div class="absolute top-[20%] right-[10%] w-[35%] h-[35%] rounded-full bg-purple-600/15 blur-[100px]"></div>
    </div>

    <div class="app-container relative z-10">
      <!-- Navigation Sidebar -->
      <aside id="app-sidebar" class="sidebar bg-slate-900 border-r border-white/10 text-white">
        <!-- Logo & Close Header -->
        <div class="p-6 border-b border-white/10 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
              ✍️
            </div>
            <div>
              <h2 class="font-extrabold text-base tracking-tight text-white">LEXIS <span class="text-indigo-400 text-[10px] font-normal tracking-widest uppercase block">Plataforma Pro</span></h2>
            </div>
          </div>
          <!-- Mobile Close Button -->
          <button id="close-mobile-menu-btn" class="lg:hidden text-slate-400 hover:text-white p-1 text-lg">
            ✕
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 p-4 space-y-1 text-sm font-medium overflow-y-auto">
          <button data-nav="dashboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">📊</span> Dashboard
          </button>
          <button data-nav="modulos" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">📚</span> Módulos Educativos
          </button>
          <button data-nav="mecanografia" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">⌨️</span> Mecanografía y Ortografía
          </button>
          <button data-nav="productividad" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">⏱️</span> Pomodoro & Lluvia
          </button>
          <button data-nav="tienda" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">🛒</span> Tienda Virtual
          </button>
          <button data-nav="configuracion" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">⚙️</span> Configuración
          </button>
          <button data-nav="admin" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-slate-300 hover:text-white hover:bg-white/10">
            <span class="text-lg">🔐</span> Administrador
          </button>
        </nav>

        <!-- Offline Status Indicator Footer -->
        <div class="p-4 border-t border-white/10 text-xs text-slate-400 flex items-center justify-between bg-slate-950/40 backdrop-blur-md">
          <span class="flex items-center gap-1.5 font-semibold text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Modo Offline
          </span>
          <button onclick="window.App.openShortcutsModal()" class="text-slate-400 hover:text-white">⌨️ Atajos</button>
        </div>
      </aside>

      <!-- Main Shell Content -->
      <div class="main-content">
        <!-- Header -->
        <header class="h-20 px-6 border-b border-white/10 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
          <div class="flex items-center gap-4">
            <button id="mobile-menu-btn" class="lg:hidden p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 text-xl font-bold">
              ☰
            </button>
            <button onclick="window.App.openGlobalSearchModal()" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:text-white hover:bg-white/10 text-xs font-semibold flex items-center gap-2 backdrop-blur-lg transition-all">
              <span>🔍 Buscar en la plataforma (Ctrl+K)</span>
            </button>
          </div>

          <!-- Header Right User Info -->
          <div class="flex items-center gap-4 text-xs font-bold">
            <span id="header-streak" class="px-3 py-1.5 rounded-xl bg-orange-500/10 border border-orange-500/20 text-orange-300 flex items-center gap-1.5 backdrop-blur-md">
              🔥 0 Días
            </span>
            <span id="header-coins" class="px-3 py-1.5 rounded-xl bg-yellow-500/10 border border-yellow-500/20 text-yellow-300 flex items-center gap-1.5 backdrop-blur-md">
              🪙 0
            </span>
            <span id="header-xp" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 backdrop-blur-md">
              0 XP
            </span>

            <button id="theme-toggle-btn" class="p-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 hover:text-white hover:bg-white/10 transition-all text-base" title="Cambiar Tema">
              🌓
            </button>

            <div class="flex items-center gap-3 pl-3 border-l border-white/10">
              <div class="w-9 h-9 rounded-full bg-slate-800 border-2 border-indigo-500 overflow-hidden flex items-center justify-center font-bold text-sm text-indigo-400">
                <span id="header-avatar">🎓</span>
              </div>
              <div class="hidden sm:block text-left">
                <p id="header-name" class="font-bold text-slate-100 leading-tight">Estudiante</p>
                <p id="header-level-title" class="text-[10px] text-slate-400 font-semibold leading-tight">Nivel 1</p>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Dynamic View Container -->
        <main id="main-view-container" class="flex-1">
          <!-- Dynamic Content rendered by router -->
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
